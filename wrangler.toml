name = "stronghold-scout"
main = "worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 不配 cron：CF 原生定时在这个账户上列得出来却从不触发（R2 台账的 lastRun 停在人工触发那一刻）。
# 实际调度由 GitHub Actions 的 scout-schedule.yml 每天 4 次（17 1,7,13,19 UTC）打 Worker。
# 手工触发：GET /run?key=$SCOUT_TOKEN（?dry=1 只报告不投递）、/probe、/ledger、/ingest。

# 只写 scout/ 前缀（state + last-report）；site/servers.json 由维护者签名发布，脚本不碰
[[r2_buckets]]
binding = "SCOUT"
bucket_name = "stronghold-assets"

[vars]
SCOUT_LOG_LEVEL = "info"
# 打开自动投递：发现的新地址会 POST 到 /api/servers/submit 进待审队列（不直接发布）
AUTO_SUBMIT = "1"
# 1 = 发现即上线（submit→approve→本机重签 PUT），需要 secret SP_SIGN_KEY + PUBLISH_KEY；否则自动退回「只入队」
AUTO_PUBLISH = "1"
