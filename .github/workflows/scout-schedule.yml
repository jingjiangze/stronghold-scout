name: scout-schedule

# 分工：采集在 Actions 跑，签名留在 Cloudflare Worker。
# 原因是 B 站按 IP 段拉黑 —— Worker 出口对评论接口一律 412（`/probe` 实测），
# 而 Actions 出口 200/code 0。签名私钥一个都不放进 GitHub：Actions 只把候选交给
# Worker 的 /ingest，由它完成 submit → approve → 补签 → PUT；台账托管在 Worker 的 R2（/ledger）。
#
# CF 原生 cron 在这个账户上列得出来但从不触发，所以定时器只能从外部打点。

on:
  schedule:
    # 每 30 分钟一轮；错开整点/半点（GitHub 的调度在整点最挤，实测会延迟几分钟）
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'crawl=云端采集并上线（定时就是这个）'
        type: choice
        default: crawl
        options: [crawl, run, probe, bili]
      dry:
        description: '只发现和校验，不投递（仅 crawl/run 有效）'
        type: boolean
        default: false
      pages:
        description: '评论区翻到第几页（留空=12；加深有触发 B 站风控的风险）'
        type: string
        default: ''
      forks:
        description: 'fork README 最多扫多少个（留空=15）'
        type: string
        default: ''

permissions: {}

concurrency:
  group: scout-run
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'crawl')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      # 守门放在 checkout 之前：跳过的一轮也要付开机+初始化时间，把判断挪到最前面，
      # 没动静时整作业 20 多秒就结束，48 轮/天才不会把私密仓的 2000 分钟/月烧穿。
      - name: Gate
        id: gate
        env:
          SCOUT_KEY: ${{ secrets.SCOUT_TOKEN }}
          CK: ${{ secrets.BILI_COOKIE }}
        run: |
          cat > gate.mjs <<'JS'
          const W = 'https://stronghold-scout.yuehuibu5561.workers.dev';
          const K = process.env.SCOUT_KEY, CK = process.env.CK || '';
          const UA = { 'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            referer: 'https://www.bilibili.com/', accept: 'application/json', ...(CK ? { cookie: CK } : {}) };
          const now = Date.now();
          let due = true, why = '兜底：默认跑';
          try {
            const cj = await (await fetch('https://api.bilibili.com/x/v2/reply/count?type=1&oid=117371003995662', { headers: UA, signal: AbortSignal.timeout(12000) })).json();
            const count = Number(cj && cj.data && (cj.data.count ?? cj.data.total));
            const s = await (await fetch(W + '/ledger', { headers: { 'x-scout-key': K }, signal: AbortSignal.timeout(15000) })).json();
            const prev = Number(s.biliCount) || 0;
            if (!Number.isFinite(count) || count === 0) { why = '评论数不可用'; }
            else if (!prev || count !== prev) { due = true; why = `评论数 ${prev} → ${count}`; }
            else if (!s.githubAt || now - s.githubAt >= 180 * 60000) { due = true; why = 'fork 扫描到期'; }
            else {
              const C = s.candidates || {};
              const n = Object.values(C).filter((c) => (now - (c.firstSeen || now) < 6 * 3600e3) || !c.lastProbe || now - c.lastProbe >= 120 * 60000).length;
              if (n > 0) { due = true; why = `${n} 个候选到复探时间`; }
              else { due = false; why = `评论数未变（${count}），各窗口均未到期`; }
            }
          } catch (e) { why = '守门异常，照常跑：' + String(e.message || e).slice(0, 60); }
          console.log(`gate due=${due} :: ${why}`);
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${due}\nwhy=${why.replace(/\n/g, ' ')}\n`);
          JS
          node gate.mjs
      - name: Report the skip
        if: steps.gate.outputs.due == 'false'
        run: |
          echo "- 守门跳过：${{ steps.gate.outputs.why }}（本轮没发采集请求）" >> "$GITHUB_STEP_SUMMARY"
          echo "本轮跳过：${{ steps.gate.outputs.why }}"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.due == 'true'
      - name: Run scout on Actions egress
        if: steps.gate.outputs.due == 'true'
        env:
          SCOUT_TOKEN: ${{ secrets.SCOUT_TOKEN }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          COMMENT_PAGES: ${{ github.event.inputs.pages }}
          README_SCAN_MAX: ${{ github.event.inputs.forks }}
          FORCE_CRAWL: '1'
          # Actions 出口是共享 IP，匿名 GitHub API 只有 60 次/小时，扫 fork 会被限流；
          # 用作业自带的受限 token 顶到 1000 次/小时，不引入任何新凭据。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node --version
          node run-actions.mjs
      - name: Summarize
        if: always()
        run: |
          [ -f scout-report.json ] || exit 0
          cat > sum.js <<'JS'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('scout-report.json', 'utf8'));
          const sub = r.submitted || [];
          const c = r.configured || {};
          const L = [
            r.skipped
              ? `- 守门跳过：${r.reason}（本轮没打采集请求，${((r.durationMs || 0) / 1000).toFixed(0)}s）`
              : `- 采集：${r.startedAt} → ${r.finishedAt}（${((r.durationMs || 0) / 1000).toFixed(0)}s）出口=GitHub Actions，投递=${r.deliverMode}`,
            `- 候选 ${r.discovered ?? '?'} | 验活 ${r.verified ?? '?'} | 上线/投递 ${sub.length}${r.throttled ? ' | 复探节流 ' + r.throttled : ''}`,
            `- 已在清单 ${r.alreadyListed ?? 0} | 队列去重 ${r.skippedQueued ?? 0} | 延后 ${r.deferred ?? 0} | 截断 ${r.truncated ? '是' : '否'}`,
            `- 台账：seen ${r.stateSize && r.stateSize.seen} | submitted ${r.stateSize && r.stateSize.submitted} | 候选池 ${r.candidates ?? '?'}`,
          ];
          if (r.fatal) L.push(`- **致命错误**：${String(r.fatal).slice(0, 300)}`);
          for (const s of sub) L.push(`  - ${s.url} → ${s.mode || 'queued'}${s.detail && s.detail.sha256 ? ' sha256 ' + String(s.detail.sha256).slice(0, 12) : ''}${s.dryRun ? '（dry）' : ''}`);
          if (!sub.length) L.push('  - （本轮没有新服务器上线）');
          if ((r.errors || []).length) L.push(`- 异常：${String(r.errors.join(' | ')).slice(0, 400)}`);
          const rej = (r.rejected || []).map((x) => { try { return new URL(x.origin).host; } catch { return String(x.origin).slice(0, 26); } });
          if (rej.length) L.push(`- 未通过 ${rej.length} 个：${rej.join(', ').slice(0, 300)}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join('\n') + '\n');
          console.log(L.join('\n'));
          JS
          node sum.js

  # 手工兜底：让 Worker 自己跑一轮（评论渠道在它那个出口是废的，只当备用）
  sweep:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call worker /run
        env:
          SCOUT_KEY: ${{ secrets.SCOUT_TOKEN }}
          DRY: ${{ github.event.inputs.dry == 'true' && '&dry=1' || '' }}
        run: |
          set -euo pipefail
          url="https://stronghold-scout.yuehuibu5561.workers.dev/run?ts=$(date -u +%s)${DRY}"
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 780 --retry 2 --retry-delay 30 \
            -H "x-scout-key: ${SCOUT_KEY}" -H 'accept: application/json' "$url") || code=000
          echo "http=$code"
          [ "$code" = "200" ] || { head -c 600 resp.json || true; exit 1; }
          head -c 1200 resp.json

  probe:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Channel probe
        env:
          SCOUT_KEY: ${{ secrets.SCOUT_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o probe.json -w '%{http_code}' --max-time 300 -H "x-scout-key: ${SCOUT_KEY}" -H 'accept: application/json' \
            "https://stronghold-scout.yuehuibu5561.workers.dev/probe?ts=$(date -u +%s)") || code=000
          echo "http=$code"
          node -e '
            const r = JSON.parse(require("fs").readFileSync("probe.json","utf8"));
            const md = [`- 探针 ${r.at} | cookie ${r.hasCookie}`, "", "| 入口 | HTTP | code | 主楼 | acount | ms |", "| --- | --- | --- | --- | --- | --- |"];
            for (const x of r.rows || []) md.push(`| ${x.name} | ${x.status ?? "-"} | ${x.code ?? (x.error || "-")} | ${x.replies ?? "-"} | ${x.acount ?? "-"} | ${x.ms ?? "-"} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
            console.log(md.join("\n"));
          '

  bili-egress:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'bili'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe bilibili from Actions egress
        env:
          CK: ${{ secrets.BILI_COOKIE }}
        run: |
          set -uo pipefail
          cat > p.mjs <<'JS'
          import fs from 'node:fs';
          const UA = {
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            referer: 'https://www.bilibili.com/', origin: 'https://www.bilibili.com',
            accept: 'application/json, text/plain, */*', 'accept-language': 'zh-CN,zh;q=0.9',
            'sec-fetch-mode': 'cors', 'sec-fetch-site': 'same-site', 'sec-fetch-dest': 'empty',
          };
          const ck = process.env.CK || '';
          const aid = '117371003995662';
          const rows = [];
          const hit = async (name, url, withCookie) => {
            const h = { ...UA, ...(withCookie && ck ? { cookie: ck } : {}) };
            try {
              const r = await fetch(url, { headers: h, signal: AbortSignal.timeout(12000) });
              const t = await r.text();
              let j = null; try { j = JSON.parse(t); } catch { /* html */ }
              rows.push({ name, http: r.status, code: j ? j.code : 'html',
                replies: j && j.data && Array.isArray(j.data.replies) ? j.data.replies.length : 0,
                acount: j && j.data && j.data.page ? j.data.page.acount : null });
            } catch (e) { rows.push({ name, http: 'ERR ' + String(e.name || e).slice(0, 20) }); }
          };
          const q = (pn) => `https://api.bilibili.com/x/v2/reply?type=1&oid=${aid}&sort=2&pn=${pn}&ps=20`;
          await hit('未登录 p1', q(1), false);
          await hit('带 cookie p1', q(1), true);
          await hit('带 cookie p12', q(12), true);
          await hit('带 cookie 热度序 p1', `https://api.bilibili.com/x/v2/reply?type=1&oid=${aid}&sort=0&pn=1&ps=20`, true);
          await hit('view 详情', 'https://api.bilibili.com/x/web-interface/view?bvid=BV1QoaU6gEF2', false);
          const md = ['| 入口 | HTTP | code | 主楼数 | acount |', '| --- | --- | --- | --- | --- |'];
          for (const x of rows) md.push(`| ${x.name} | ${x.http} | ${x.code ?? '-'} | ${x.replies} | ${x.acount ?? '-'} |`);
          md.push('', `- cookie 注入：${ck ? 'yes ' + ck.length + 'B' : 'NO'}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
          console.log(JSON.stringify(rows, null, 1));
          JS
          node p.mjs
