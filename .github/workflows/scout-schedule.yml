name: scout-schedule

# CF 原生 cron 在这个账户上不触发（schedules 列得出来但 scheduled() 从不执行），
# 所以由 GitHub Actions 从外部按点开 Worker 的 /run —— Actions 出口能正常访问 workers.dev。
# 口令走请求头，不进 URL，避免出现在 curl 报错和 Actions 日志里。

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '调哪个端点：run=扫一轮，probe=渠道探针'
        type: choice
        default: run
        options: [run, probe, bili]
      dry:
        description: '只报告和校验，不投递/不发布（仅 target=run 有效）'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: scout-run
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EP: ${{ github.event.inputs.target || 'run' }}
    steps:
      - name: Call stronghold-scout worker
        env:
          SCOUT_KEY: ${{ secrets.SCOUT_TOKEN }}
          DRY: ${{ github.event.inputs.dry == 'true' && '&dry=1' || '' }}
        run: |
          set -euo pipefail
          url="https://stronghold-scout.yuehuibu5561.workers.dev/${EP}?ts=$(date -u +%s)${DRY}"
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            --max-time 780 --retry 2 --retry-delay 30 \
            -H "x-scout-key: ${SCOUT_KEY}" -H 'accept: application/json' "$url") || code=000
          echo "http=$code"
          if [ "$code" != "200" ]; then
            echo '响应不是 200，前 600 字节：'
            head -c 600 resp.json || true
            exit 1
          fi
          cat > summary.js <<'JS'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('resp.json', 'utf8'));
          const L = [];
          if (process.env.EP === 'probe') {
            L.push(`- 探针时间：${r.at} | 带 cookie：${r.hasCookie}`);
            L.push('| 入口 | HTTP | code | 主楼数 | acount | 耗时 | 命中链接 / 置顶 |');
            L.push('| --- | --- | --- | --- | --- | --- | --- |');
            for (const x of r.rows || []) {
              L.push(`| ${x.name} | ${x.status ?? '-'} | ${x.code ?? (x.error || '')} | ${x.replies ?? '-'} | ${x.acount ?? '-'} | ${x.ms ?? '-'}ms | ${(x.links || []).slice(0, 2).join(' ')}${x.upper ? ' 置顶:' + x.upper.slice(0, 40) : ''} |`);
            }
          } else {
            const sub = r.submitted || [];
            const c = r.configured || {};
            L.push(`- 扫描：${r.startedAt} → ${r.finishedAt}（${((r.durationMs || 0) / 1000).toFixed(0)}s）`);
            L.push(`- 候选 ${r.discovered ?? '?'} | 验活 ${r.verified ?? '?'} | 本轮投递 ${sub.length}`);
            L.push(`- 已在清单 ${r.alreadyListed ?? 0} | 队列去重 ${r.skippedQueued ?? 0} | 延后 ${r.deferred ?? 0} | 截断 ${r.truncated ? '是' : '否'}`);
            L.push(`- 渠道：githubToken=${c.githubToken} biliCookie=${c.biliCookie} autoPublish=${c.autoPublish} 视频数=${c.videos}`);
            L.push(`- 台账：候选 ${r.candidates ?? '?'} 条 | seen ${r.stateSize && r.stateSize.seen} | submitted ${r.stateSize && r.stateSize.submitted}`);
            if (r.fatal) L.push(`- **致命错误**：${String(r.fatal).slice(0, 300)}`);
            for (const s of sub) L.push(`  - ${s.url} → ${s.mode || 'queued'}${s.detail && s.detail.sha256 ? ' sha256 ' + String(s.detail.sha256).slice(0, 12) : ''}`);
            if (!sub.length) L.push('  - （本轮没有新服务器上线）');
            if ((r.errors || []).length) L.push(`- 异常：${String(r.errors.join(' | ')).slice(0, 300)}`);
            const hosts = (r.rejected || []).map((x) => { try { return new URL(x.origin).host; } catch { return String(x.origin).slice(0, 30); } });
            if (hosts.length) L.push(`- 未通过 ${hosts.length} 个：${hosts.join(', ').slice(0, 300)}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join('\n') + '\n');
          console.log(L.join('\n'));
          JS
          node summary.js
          if [ -n "${DRY:-}" ]; then echo '::warning::dry run，未投递'; fi

  # B 站风控看的是出口 IP：Cloudflare 全线 412，GitHub Actions 的出口是不是也被拉黑决定
  # 「云端读评论区」到底能不能落地。只在手工选 bili 时跑，不进定时。
  bili-egress:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'bili'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe bilibili from Actions egress
        env:
          CK: ${{ secrets.BILI_COOKIE }}
        run: |
          set -uo pipefail
          cat > p.js <<'JS'
          import fs from 'node:fs';
          const UA = {
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            referer: 'https://www.bilibili.com/', origin: 'https://www.bilibili.com',
            accept: 'application/json, text/plain, */*', 'accept-language': 'zh-CN,zh;q=0.9',
            'sec-fetch-mode': 'cors', 'sec-fetch-site': 'same-site', 'sec-fetch-dest': 'empty',
          };
          const ck = process.env.CK || '';
          const aid = '117371003995662';
          const rows = [];
          const hit = async (name, url, withCookie) => {
            const h = { ...UA, ...(withCookie && ck ? { cookie: ck } : {}) };
            try {
              const r = await fetch(url, { headers: h, signal: AbortSignal.timeout(12000) });
              const t = await r.text();
              let j = null; try { j = JSON.parse(t); } catch { /* html */ }
              rows.push({ name, http: r.status, code: j ? j.code : 'html',
                replies: j && j.data && Array.isArray(j.data.replies) ? j.data.replies.length : 0,
                acount: j && j.data && j.data.page ? j.data.page.acount : null });
            } catch (e) { rows.push({ name, http: 'ERR ' + String(e.name || e).slice(0, 20) }); }
          };
          const q = (pn) => `https://api.bilibili.com/x/v2/reply?type=1&oid=${aid}&sort=2&pn=${pn}&ps=20`;
          await hit('未登录 p1', q(1), false);
          await hit('带 cookie p1', q(1), true);
          await hit('带 cookie p30', q(30), true);
          await hit('view 详情', 'https://api.bilibili.com/x/web-interface/view?bvid=BV1QoaU6gEF2', false);
          await hit('弹幕 XML', 'https://comment.bilibili.com/42396680690.xml', false);
          await hit('搜索 WBI 前的 nav', 'https://api.bilibili.com/x/web-interface/nav', false);
          const md = ['| 入口 | HTTP | code | 主楼数 | acount |', '| --- | --- | --- | --- | --- |'];
          for (const x of rows) md.push(`| ${x.name} | ${x.http} | ${x.code ?? '-'} | ${x.replies} | ${x.acount ?? '-'} |`);
          md.push('', `- cookie 是否注入：${ck ? 'yes len ' + ck.length : 'NO（仓库没配 BILI_COOKIE secret）'}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
          console.log(JSON.stringify(rows, null, 1));
          JS
          node p.js
