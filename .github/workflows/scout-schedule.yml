name: scout-schedule

# CF 原生 cron 在这个账户上不触发（schedules 列得出来但 scheduled() 从不执行），
# 所以由 GitHub Actions 从外部按点开 Worker 的 /run —— Actions 出口能正常访问 workers.dev。
# 口令走请求头，不进 URL，避免出现在 curl 报错和 Actions 日志里。

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '只报告和校验，不投递/不发布'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: scout-run
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger stronghold-scout worker
        env:
          SCOUT_KEY: ${{ secrets.SCOUT_TOKEN }}
          DRY: ${{ github.event.inputs.dry == 'true' && '&dry=1' || '' }}
        run: |
          set -euo pipefail
          url="https://stronghold-scout.yuehuibu5561.workers.dev/run?ts=$(date -u +%s)${DRY}"
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            --max-time 780 --retry 2 --retry-delay 30 \
            -H "x-scout-key: ${SCOUT_KEY}" -H 'accept: application/json' "$url") || code=000
          echo "http=$code"
          if [ "$code" != "200" ]; then
            echo '响应不是 200，前 600 字节：'
            head -c 600 resp.json || true
            exit 1
          fi
          cat > summary.js <<'JS'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('resp.json', 'utf8'));
          const sub = r.submitted || [];
          const c = r.configured || {};
          const lines = [
            `- 扫描：${r.startedAt} → ${r.finishedAt}（${((r.durationMs || 0) / 1000).toFixed(0)}s）`,
            `- 候选 ${r.discovered ?? '?'} | 验活 ${r.verified ?? '?'} | 本轮投递 ${sub.length}`,
            `- 已在清单 ${r.alreadyListed ?? 0} | 队列去重 ${r.skippedQueued ?? 0} | 延后 ${r.deferred ?? 0} | 截断 ${r.truncated ? '是' : '否'}`,
            `- 渠道：githubToken=${c.githubToken} biliCookie=${c.biliCookie} autoPublish=${c.autoPublish} 视频数=${c.videos}`,
            `- 台账：候选 ${r.candidates ?? '?'} 条 | seen ${r.stateSize && r.stateSize.seen} | submitted ${r.stateSize && r.stateSize.submitted}`,
          ];
          if (r.fatal) lines.push(`- **致命错误**：${String(r.fatal).slice(0, 300)}`);
          for (const s of sub) lines.push(`  - ${s.url} → ${s.mode || 'queued'}${s.detail && s.detail.sha256 ? ' sha256 ' + String(s.detail.sha256).slice(0, 12) : ''}`);
          if (!sub.length) lines.push('  - （本轮没有新服务器上线）');
          if ((r.errors || []).length) lines.push(`- 异常：${String(r.errors.join(' | ')).slice(0, 300)}`);
          const hosts = (r.rejected || []).map(x => { try { return new URL(x.origin).host; } catch { return String(x.origin).slice(0, 30); } });
          if (hosts.length) lines.push(`- 未通过 ${hosts.length} 个：${hosts.join(', ').slice(0, 300)}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          JS
          node summary.js
          if [ -n "${DRY:-}" ]; then echo '::warning::dry run，未投递'; fi
